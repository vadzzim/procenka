x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-procenka}:${POSTGRES_PASSWORD:-procenka}@postgres:5432/${POSTGRES_DB:-procenka}
  FAKE_SITES_URL: http://fake-sites:8001

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procenka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procenka}
      POSTGRES_DB: ${POSTGRES_DB:-procenka}
    ports:
      # Non-standard host port to avoid clashing with a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  fake-sites:
    build: ../fake_sites
    ports:
      - "127.0.0.1:${FAKE_SITES_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/control/modes')"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  api:
    build: ../backend
    image: procenka-backend
    environment:
      <<: *backend-env
      # How long a quarantined recommendation can be confirmed after its calculation.
      QUARANTINE_CONFIRM_MAX_AGE_MINUTES: ${QUARANTINE_CONFIRM_MAX_AGE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      # /health answers once migrations and seed are done (uvicorn starts after them)
      # and returns 503 while the database does not answer SELECT 1.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 5s

  worker:
    # Same image as api (built once, cached for the second service).
    build: ../backend
    image: procenka-backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      # Scheduled runs, seconds. Off by default in the demo: on an empty runs table
      # (start, reset) a scheduled run would publish before the manual step 2 of the
      # scenario. Shown separately: SCHEDULE_INTERVAL_SECONDS=60 docker compose up -d worker
      SCHEDULE_INTERVAL_SECONDS: ${SCHEDULE_INTERVAL_SECONDS:-0}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      # Touched at start (after recovery) and after every loop iteration that
      # got through to the database.
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      # Optional proxy of each source (e.g. http://proxy.local:3128); empty = no proxy.
      HTML_CATALOG_PROXY: ${HTML_CATALOG_PROXY:-}
      JSON_API_PROXY: ${JSON_API_PROXY:-}
    healthcheck:
      # Healthy while the loop iterates and reaches the database: the heartbeat is
      # at most 120 s old (longer than any run: the per-source time budget is 30 s).
      test: ["CMD", "python", "-m", "app.worker.heartbeat", "/tmp/worker-heartbeat", "--max-age", "120"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    # A crashed worker comes back; its run left running is recovered as interrupted.
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      fake-sites:
        condition: service_healthy

  nginx:
    # Frontend static build + reverse proxy: /api/ and /health go to api:8000.
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
