services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-procenka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procenka}
      POSTGRES_DB: ${POSTGRES_DB:-procenka}
    ports:
      # Non-standard host port to avoid clashing with a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
