# Static frontend + reverse proxy to the api service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Docker DNS; resolve `api` on request, so a recreated api container
    # (new IP) does not require restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_types application/json application/javascript text/css;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Demo reset and run creation are short; the 60 s default is enough.
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed Vite assets never change.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
