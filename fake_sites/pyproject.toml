[project]
name = "procenka-fake-sites"
version = "0.1.0"
description = "Synthetic competitor sites for the procenka demo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fake_sites"
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["fake_sites", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
